<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Santri Menuju Pondok</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef3ea;--fg:#1f2b1f;--card:#fff;--accent:#2f7d4f;--line:#c9d8c5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101712;--fg:#e6f0e4;--card:#18231b;--accent:#5fc388;--line:#2a3a2d}}
:root[data-theme="dark"]{--bg:#101712;--fg:#e6f0e4;--card:#18231b;--accent:#5fc388;--line:#2a3a2d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:10px}
#app{width:100%;max-width:640px;position:relative}
#hud{display:flex;justify-content:space-between;font-weight:600;font-size:.95rem;margin-bottom:6px}
canvas{width:100%;display:block;border-radius:12px;border:3px solid var(--line)}
#dlg{position:absolute;left:0;right:0;top:34px;bottom:0;display:flex;align-items:center;justify-content:center;padding:14px}
#box{background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:16px;max-width:420px;text-align:center;box-shadow:0 6px 24px #0006}
#box h2{margin:0 0 6px;font-size:1.1rem}
#box p{line-height:1.55;margin:0 0 12px;font-size:.95rem}
button{font-family:inherit}
#go{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 22px;font-size:1rem}
#pad{display:flex;justify-content:space-between;width:100%;max-width:640px;margin-top:10px;gap:8px}
#pad button{flex:1;height:58px;font-size:1.5rem;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;touch-action:none;user-select:none}
#pad button:active{background:var(--accent);color:#fff}
small{opacity:.7;margin-top:8px}
</style>
</head>

<div id="app">
<div id="hud"><span id="hp"></span><span id="sn"></span><span id="bk"></span></div>
<canvas id="c" width="640" height="360"></canvas>
<div id="dlg"><div id="box"><h2 id="dh"></h2><p id="dp"></p><button id="go">Lanjut</button></div></div>
</div>
<div id="pad"><button id="L">◀</button><button id="J">⬆ Lompat</button><button id="R">▶</button></div>
<small>Panah / WASD + Spasi. Ambil 📖🍎⭐ dan hindari rintangan!</small>
